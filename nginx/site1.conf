
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream backend_servers {
    server 192.168.137.131:8080;
    server 192.168.137.130:8081;
}

server {
    listen 80;
    server_name site1.local;

    return 301 https://site1.local$request_uri;
}

server {
    listen 443 ssl;
    server_name site1.local;

    root /var/www/site1;
    index index.html;

    ssl_certificate /etc/nginx/ssl/site1.local.crt;
    ssl_certificate_key /etc/nginx/ssl/site1.local.key;

    location /api/ {
	
	limit_req zone=api_limit burst=10 nodelay;
	limit_conn conn_limit 2;
        proxy_pass http://backend_servers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
    }
}
